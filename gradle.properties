org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain: this host's auto-detected default is a JRE-only JDK 25 (no javac),
# which breaks Java compile tasks. Pin Gradle to the provisioned JDK 21 (has
# javac) so :shared:jvmTest and the Android build run. We must (a) point
# discovery at JDK 21, (b) turn OFF auto-detection so the JRE-only JDK 25 is
# never selected, and (c) run the daemon itself on JDK 21.
org.gradle.java.installations.paths=/home/omar/jdks/jdk-21.0.11+10
org.gradle.java.installations.auto-detect=false
org.gradle.java.home=/home/omar/jdks/jdk-21.0.11+10

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
