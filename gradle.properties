org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

# Toolchain: the build needs a full JDK 21 (with javac) — a JRE-only JDK, or a
# JDK newer than what AGP/Kotlin support, breaks the Java compile tasks. Gradle
# runs on whatever JDK invokes it (JAVA_HOME), so point JAVA_HOME at a JDK 21.
# Do NOT pin an absolute `org.gradle.java.home` here: this file is committed and
# a machine-specific path breaks the build on every other machine (and in CI).
# For a per-machine override, put it in ~/.gradle/gradle.properties instead:
#   org.gradle.java.home=/path/to/your/jdk-21

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
