# XcodeGen spec — generates iosApp.xcodeproj reproducibly.
# Run:  cd iosApp && xcodegen generate   (brew install xcodegen)
# Then: open iosApp.xcodeproj  and build to a simulator/device on macOS.
#
# A hand-written .pbxproj is intentionally NOT committed: it is huge and fragile.
# This spec is the source of truth.
#
# BUILD SCOPE: the target compiles only the Hermes Life Agent client path
# (Connect + streaming Chat), mirroring the shipped Android app. Per the iOS
# README this client is a **pure-Swift** starting point (URLSession; it does NOT
# `import Shared`), so the KMP `Shared.framework` is intentionally NOT a
# dependency here — that keeps the iOS build self-contained (no Kotlin/Native
# link + framework-embed step). The legacy on-device stack (Notes/Reminders/Plan
# over on-device ML + MLX) is retired on iOS just as it was on Android; those
# .swift files stay in the repo but are not in the build target. Re-add the
# framework dependency + preBuildScript here if iOS adopts the KMP shared logic.
name: iosApp
options:
  bundleIdPrefix: com.personalagent
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    # Explicit whitelist — only the self-contained Hermes-client files
    # (Foundation + SwiftUI + Security; no `import Shared`).
    sources:
      - path: iosApp/iOSApp.swift
      - path: iosApp/HermesClient.swift
      - path: iosApp/HermesLifeAgentView.swift
    info:
      path: iosApp/Info.plist
      # XcodeGen GENERATES this plist from the keys below — a hand-edited
      # Info.plist at this path is overwritten on `xcodegen generate`. So the
      # app version and these UI keys must live here, not in the .plist file.
      properties:
        CFBundleShortVersionString: "2.4.0"   # match the Android release train
        CFBundleVersion: "240"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalagent.ios
        GENERATE_INFOPLIST_FILE: NO
