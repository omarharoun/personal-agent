# XcodeGen spec — generates iosApp.xcodeproj reproducibly.
# Run:  cd iosApp && xcodegen generate   (brew install xcodegen)
# Then: open iosApp.xcodeproj  and build to a simulator/device on macOS.
#
# A hand-written .pbxproj is intentionally NOT committed: it is huge, fragile,
# and impossible to validate in this Linux sandbox. This spec is the source of
# truth; it produces a correct project that links the shared KMP framework.
#
# BUILD SCOPE: the target compiles only the Hermes Life Agent client path
# (Connect + streaming Chat), mirroring the shipped Android app. The legacy
# on-device stack (Notes/Reminders/Plan over on-device ML + MLX) is retired on
# iOS exactly as it was on Android — those .swift files stay in the repo for
# reference but are intentionally NOT listed under `sources`, so they don't
# compile. Re-add them here (and their MLX package) if that path is revived.
name: iosApp
options:
  bundleIdPrefix: com.personalagent
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Where Gradle drops the compiled `Shared.framework` for the active config.
    FRAMEWORK_SEARCH_PATHS:
      - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
targets:
  iosApp:
    type: application
    platform: iOS
    # Explicit whitelist — only the Hermes-client files (self-contained Swift:
    # Foundation + SwiftUI + Security). No `import Shared`, so no KMP interop to
    # keep in sync here; the framework is still built + embedded below.
    sources:
      - path: iosApp/iOSApp.swift
      - path: iosApp/HermesClient.swift
      - path: iosApp/HermesLifeAgentView.swift
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalagent.ios
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - framework: Shared.framework
        embed: true
    # Build the shared framework before compiling Swift so it is present + embedded.
    preBuildScripts:
      - name: "Build shared KMP framework"
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
