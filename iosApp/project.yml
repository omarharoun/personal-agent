# XcodeGen spec — generates iosApp.xcodeproj reproducibly.
# Run:  cd iosApp && xcodegen generate   (brew install xcodegen)
# Then: xcodebuild ... or open iosApp.xcodeproj on macOS.
#
# A hand-written .pbxproj is intentionally NOT committed: it is huge and fragile.
# This spec is the source of truth.
#
# BUILD SCOPE (feat/ios-parity): the app is the **Hermes Life Agent client** at
# FULL feature parity with Android, built as SwiftUI over the shared Kotlin
# Multiplatform module (`:shared`). The KMP `Shared.framework` (iosArm64 for
# device, iosX64 for the Intel-Mac simulator) is built + embedded by the
# `embedAndSignAppleFrameworkForXcode` gradle task in a pre-build phase. The
# legacy on-device stack (MLX LLM / NaturalLanguage embedder / model
# provisioning / the pure-Swift URLSession client) is excluded from the target —
# those .swift files stay in the repo for reference but are not compiled.
name: iosApp
options:
  bundleIdPrefix: com.personalagent
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    # Compile every .swift in iosApp/ EXCEPT the retired on-device stack + the
    # pure-Swift client that the shared Kotlin `HermesClient` now replaces.
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
          # Pure-Swift Hermes client — replaced by shared Kotlin HermesClient.
          - "HermesClient.swift"
          - "HermesLifeAgentView.swift"
          # Retired on-device stack (MLX LLM / NL embedder / provisioning / cloud).
          - "ContentView.swift"
          - "ConversationView.swift"
          - "AppModel.swift"
          - "IosEmbedder.swift"
          - "IosOnDeviceLlm.swift"
          - "LlmModelProvisioner.swift"
          - "IosModelProvisioner.swift"
          - "ModelSetupModel.swift"
          - "ModelSetupView.swift"
          - "IosReminderScheduler.swift"
          - "CloudSettingsView.swift"
          - "MemoryView.swift"
          - "AgeGateView.swift"
          - "OnboardingFlowView.swift"
          - "RecoverySetupView.swift"
          - "SettingsView.swift"
          - "SupportResponseView.swift"
          - "TrustedContactsView.swift"
    info:
      path: iosApp/Info.plist
      # XcodeGen GENERATES this plist from the keys below — a hand-edited
      # Info.plist at this path is overwritten on `xcodegen generate`. So the
      # app version and these UI keys must live here, not in the .plist file.
      properties:
        CFBundleShortVersionString: "2.5.0"   # match the Android release train
        CFBundleVersion: "250"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # On-device speech recognition + microphone for hold-to-talk voice input.
        NSMicrophoneUsageDescription: "Hold the mic to dictate a message to your Life Agent. Audio is transcribed on your device."
        NSSpeechRecognitionUsageDescription: "Speech is recognized on your device to turn what you say into a message. Nothing is sent to Apple or any third party."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalagent.ios
        GENERATE_INFOPLIST_FILE: NO
        # Link + find the KMP framework built by the pre-build phase below.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build shared KMP framework (Shared.framework)"
        # Runs the Kotlin/Native embed+sign task, which builds Shared.framework
        # for the current CONFIGURATION/SDK/ARCHS and copies it into the app.
        # JAVA_HOME must be set explicitly — Xcode build phases don't source the
        # login shell (see ~/.build_env on the build Mac).
        script: |
          # Portable across the build Mac (~/.build_env) and CI (setup-java /
          # runner Android SDK): use the inherited env, fall back to the Mac paths.
          export JAVA_HOME="${JAVA_HOME:-$HOME/tools/jdk21/Contents/Home}"
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
