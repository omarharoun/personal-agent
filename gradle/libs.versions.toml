[versions]
# Build tooling — resolved against this sandbox on 2026-06-27 (latest stable at the time).
kotlin = "2.4.0"
agp = "9.2.1"
coroutines = "1.11.0"
serialization = "1.11.0"

# AndroidX / Compose
androidx-core = "1.17.0"
androidx-activity = "1.11.0"
androidx-lifecycle = "2.9.4"
composeBom = "2026.06.00"
androidx-work = "2.10.5"
androidx-test-junit = "1.2.1"
androidx-test-runner = "1.6.2"

# On-device ML — ONNX Runtime Mobile for the all-MiniLM-L6-v2 embedder (Step 2).
onnxruntime = "1.20.0"
# On-device LLM — MediaPipe LLM Inference API for a small local model (Step 3).
mediapipeGenai = "0.10.24"

# Cloud transport — Ktor multiplatform HTTP client for the Step 4 escalation
# path (zero-retention HTTPS calls to a frontier model). Engine is selected per
# platform: OkHttp on Android, Darwin on iOS. MockEngine drives the tests.
ktor = "3.5.1"

# Android SDK levels
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }

onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
mediapipe-tasks-genai = { module = "com.google.mediapipe:tasks-genai", version.ref = "mediapipeGenai" }

# Ktor multiplatform HTTP client (Step 4 cloud transport).
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Platform engines: OkHttp on Android, Darwin (NSURLSession) on iOS.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
# Test-only in-memory engine — lets unit tests exercise the client with no network.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# JVM test-only real engine — drives the live-Hermes integration test (opt-in via env).
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# AGP 9.0+ requires the dedicated KMP library plugin (the classic
# com.android.library is incompatible with the kotlin.multiplatform plugin).
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
