name: iOS build (unsigned IPA)

# MANUAL ONLY — never runs on push/PR. Trigger it from the Actions tab
# ("Run workflow") or with:  gh workflow run "iOS build (unsigned IPA)"
#
# Produces an UNSIGNED .ipa so you can sideload the Hermes Life Agent onto your
# own iPhone with a FREE Apple ID via AltStore / Sideloadly (they re-sign it on
# your Mac/PC) — no paid Apple Developer account and no signing secrets in CI.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    # macOS runner — the shared KMP framework links iosArm64 (a device build
    # cross-compiles fine on either host arch).
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # XcodeGen (latest) emits a modern project format (objectVersion 77) that
      # needs Xcode 16+, so pin the newest stable Xcode on the runner.
      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The app is SwiftUI over the shared KMP module: the Xcode pre-build phase
      # runs ./gradlew :shared:embedAndSignAppleFrameworkForXcode, which needs a
      # JDK (with javac) and — because :shared also declares an android { } target
      # that Gradle configures — an Android SDK.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The committed gradle.properties pins org.gradle.java.home to a Linux dev
      # path; on the runner point Gradle at the setup-java JDK instead. A
      # GRADLE_USER_HOME properties file takes precedence over the project one.
      - name: Point Gradle at the runner JDK
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.java.home=$JAVA_HOME"
            echo "org.gradle.java.installations.paths=$JAVA_HOME"
            echo "org.gradle.java.installations.auto-detect=false"
          } >> ~/.gradle/gradle.properties

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Archive (unsigned, generic iOS device / arm64)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration "${{ github.event.inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration "${{ github.event.inputs.configuration }}" \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(ls -d "$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/"*.app | head -n1)
          echo "App: $APP_PATH"
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          cp -R "$APP_PATH" "$WORK/Payload/"
          (cd "$WORK" && zip -qry "$RUNNER_TEMP/hermes-life-agent-unsigned.ipa" Payload)
          ls -lh "$RUNNER_TEMP/hermes-life-agent-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-life-agent-unsigned-ipa
          path: ${{ runner.temp }}/hermes-life-agent-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
