name: Android APK

# Builds installable Android APKs and publishes them as workflow artifacts.
#
# Why CI and not a local build: the Android SDK and Google's Maven repo are both
# served from dl.google.com, which is unreachable from the sandboxed agent
# environment. A GitHub-hosted runner can reach it, so the APK is built here.
#
# Pushing a `v*` tag additionally publishes the APKs as GitHub Release assets,
# which (unlike workflow artifacts) have permanent URLs and need no GitHub login.
on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # required to create the Release on a v* tag

    steps:
      - uses: actions/checkout@v4

      # AGP 9 / Kotlin 2.4 build on JDK 21; the modules compile to JVM 17 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Installs sdkmanager and accepts the SDK licenses. compileSdk/targetSdk are
      # 36 (gradle/libs.versions.toml), which the runner image does not ship yet.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Primary artifact: debug-signed, installable on any device with
      # "install from unknown sources" enabled. No release keystore needed.
      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      # Release APK: R8 minify + resource shrinking. Without a gitignored
      # keystore.properties this falls back to DEBUG signing (see
      # androidApp/build.gradle.kts) - installable for testing, NOT uploadable
      # to Play. Non-blocking so a shrinker problem can't sink the debug APK.
      - name: Build release APK (R8, debug-signed fallback)
        id: release
        continue-on-error: true
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: List APK outputs
        if: always()
        run: find androidApp/build/outputs -name '*.apk' -print -exec ls -lh {} \; || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-agent-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: personal-agent-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # On a v* tag, attach the APKs to a GitHub Release. Release assets get a
      # stable, directly-downloadable URL that works without signing in — the
      # practical way to get the app onto a phone. Uses the runner's preinstalled
      # gh CLI rather than a third-party action.
      - name: Publish APKs to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk \
             "dist/personal-agent-${TAG}-debug.apk"
          if [ -f androidApp/build/outputs/apk/release/androidApp-release.apk ]; then
            cp androidApp/build/outputs/apk/release/androidApp-release.apk \
               "dist/personal-agent-${TAG}-release.apk"
          fi
          gh release create "$TAG" dist/*.apk \
            --title "$TAG" \
            --prerelease \
            --notes 'Automated build from `.github/workflows/android-apk.yml`.

          | File | Notes |
          | --- | --- |
          | `*-debug.apk` | Debug-signed. Install directly on a device. |
          | `*-release.apk` | R8-minified. Debug-signed unless a real `keystore.properties` was supplied — **not** uploadable to Play. |

          Both APKs are signed with the Android **debug** key, so they are for testing/sideloading only.'
